name: Deploy Prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          # ⚠️ Défaut de l'action : 10 MINUTES, et le `pnpm run build`
          # du frontend les dépasse — compilation 3 min, TypeScript
          # 100 s, puis la génération de 102 pages. Au-delà, l'action
          # COUPE la session : le `docker compose up` ne se termine
          # jamais, les anciens conteneurs restent en place, et le
          # déploiement est signalé en échec alors que rien n'est
          # cassé. Bon mode d'échec, mais diagnostic trompeur.
          command_timeout: 40m
          script: |
            set -e
            cd ~/apps/lprds-prod
            git pull origin main

            # Version du bundle frontend = SHA du commit RÉELLEMENT déployé.
            #
            # Elle doit être fournie ici, et pas dans un `.env` : une variable
            # `NEXT_PUBLIC_*` est lue à la COMPILATION du bundle, alors que
            # `env_file` ne vaut qu'au runtime. Sans elle, le sondage de
            # /version.json reste désactivé et un navigateur déjà ouvert garde
            # l'ancien code après un déploiement.
            export APP_VERSION="$(git rev-parse --short HEAD)"
            echo "Déploiement de $APP_VERSION"
            docker compose up -d --build

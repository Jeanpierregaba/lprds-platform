name: Deploy Preprod

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/lprds-preprod
            git pull origin develop

            # Version du bundle frontend = SHA du commit RÉELLEMENT déployé.
            #
            # Elle doit être fournie ici, et pas dans un `.env` : une variable
            # `NEXT_PUBLIC_*` est lue à la COMPILATION du bundle, alors que
            # `env_file` ne vaut qu'au runtime. Sans elle, le sondage de
            # /version.json reste désactivé et un navigateur déjà ouvert garde
            # l'ancien code après un déploiement.
            export APP_VERSION="$(git rev-parse --short HEAD)"
            echo "Déploiement de $APP_VERSION"
            docker compose up -d --build

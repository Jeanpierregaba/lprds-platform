services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adminlprds
      POSTGRES_PASSWORD: lprds
      POSTGRES_DB: lprds_database
    ports:
      - "5432:5432"
    volumes:
      - lprds_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminlprds -d lprds_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Toujours les noms de service Docker, quoi que dise le .env local (qui
      # pointe vers "localhost" pour un usage hors-Docker) — évite le piège
      # classique "ça marche en local mais pas en conteneur".
      DATABASE_URL: postgresql+asyncpg://adminlprds:lprds@db:5432/lprds_database
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - lprds_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Moteur de traduction gratuit, activé à la demande :
  #   docker compose --profile translate up -d
  #
  # Hors profil, il ne démarre pas : l'image embarque les modèles de langue
  # (plusieurs Go) et n'a aucune raison de tourner sur une installation qui
  # utilise Claude, ou qui n'a pas activé la traduction du tout.
  #
  # `LT_LOAD_ONLY` limite le téléchargement aux deux langues du projet — sans
  # lui, l'image tire une cinquantaine de paires dont aucune ne sert.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ["translate"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "fr,en"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - lprds_libretranslate:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/languages')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  lprds_postgres_data:
  lprds_media:
  lprds_libretranslate:

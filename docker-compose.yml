services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: lprds_preprod_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lprds_preprod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lprds_preprod_user -d lprds_preprod"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - internal

  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - internal
      - web

  frontend:
    build: ./frontend
    restart: always
    env_file: ./frontend/.env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - web

networks:
  internal:
  web:

volumes:
  postgres_data:
  backend_media:

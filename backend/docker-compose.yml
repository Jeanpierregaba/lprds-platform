services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adminlprds
      POSTGRES_PASSWORD: lprds
      POSTGRES_DB: lprds_database
    ports:
      - "5432:5432"
    volumes:
      - lprds_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminlprds -d lprds_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Toujours les noms de service Docker, quoi que dise le .env local (qui
      # pointe vers "localhost" pour un usage hors-Docker) — évite le piège
      # classique "ça marche en local mais pas en conteneur".
      DATABASE_URL: postgresql+asyncpg://adminlprds:lprds@db:5432/lprds_database
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - lprds_media:/app/media
    # Le worker et le beat attendent CE signal : l'entrypoint du backend est le
    # seul à migrer la base, et une tâche qui partirait avant aurait un schéma
    # d'avance sur elle. `service_started` ne dirait que « le process existe ».
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Tâches planifiées ──────────────────────────────────────────
  #
  # Deux services et non un seul (`worker --beat`) : le beat est un
  # ORDONNANCEUR, il ne doit exister qu'en un exemplaire. Fusionné au worker, il
  # repartirait avec chaque réplique — et passer les workers à deux doublerait
  # chaque rappel reçu par un parent. La séparation permet de monter les workers
  # sans jamais toucher au nombre d'ordonnanceurs.
  #
  # Les deux réutilisent l'image du backend mais PAS son entrypoint, qui migre,
  # seede et lance uvicorn : trois conteneurs qui migrent en même temps, c'est
  # la course garantie. `entrypoint: []` le neutralise explicitement.
  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adminlprds:lprds@db:5432/lprds_database
      REDIS_URL: redis://redis:6379/0
    entrypoint: []
    # `--concurrency=2` plutôt que le défaut (un process par cœur) : ces tâches
    # attendent du réseau — traduction, SMTP, base — elles ne calculent rien.
    # Sur un hôte à 16 cœurs, le défaut ouvrirait seize fois le pool Postgres
    # pour un travail qui dort.
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adminlprds:lprds@db:5432/lprds_database
      REDIS_URL: redis://redis:6379/0
    entrypoint: []
    # L'état du planificateur vit dans un volume : sans lui, chaque
    # redémarrage repart d'une ardoise vierge et refait tomber les échéances
    # déjà passées. Les tâches sont idempotentes, donc ça ne casse rien — mais
    # un parent recevrait quand même un second rappel à chaque déploiement.
    command: >
      celery -A app.core.celery_app beat --loglevel=info
      --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - lprds_celery_beat:/var/lib/celery
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Moteur de traduction gratuit, activé à la demande :
  #   docker compose --profile translate up -d
  #
  # Hors profil, il ne démarre pas : l'image embarque les modèles de langue
  # (plusieurs Go) et n'a aucune raison de tourner sur une installation qui
  # utilise Claude, ou qui n'a pas activé la traduction du tout.
  #
  # `LT_LOAD_ONLY` limite le téléchargement aux deux langues du projet — sans
  # lui, l'image tire une cinquantaine de paires dont aucune ne sert.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ["translate"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "fr,en"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - lprds_libretranslate:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/languages')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  lprds_postgres_data:
  lprds_media:
  lprds_libretranslate:
  lprds_celery_beat:

<!DOCTYPE html>
<html lang="en">
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px">
  <h2 style="color:#2563eb">Reset your password</h2>
  <p>Hello {{ first_name }},</p>
  <p>You asked to reset your LPRDS password. Click the button below to choose a new one:</p>
  <a href="{{ reset_url }}" style="background:#2563eb;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:16px">
    Reset my password
  </a>
  <p style="margin-top:16px">This link is valid for <strong>{{ expire_minutes }} minutes</strong>.</p>
  <p style="color:#6b7280;font-size:14px">If you did not ask for this, simply ignore this email: your password stays unchanged.</p>
</body>
</html>

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
# Aucun test async dans cette suite (client HTTP synchrone contre un vrai
# serveur, cf. tests/conftest.py) — évite l'avertissement de pytest-asyncio
# sur le scope de boucle par défaut, sans configurer un mode inutilisé.
asyncio_mode = strict

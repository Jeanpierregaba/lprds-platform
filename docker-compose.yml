services:
  # ⚠️ Nom d'utilisateur et de base PARAMÉTRABLES, avec les valeurs historiques
  # en défaut. Ce fichier sert aux DEUX environnements : la production tournait
  # donc avec une base nommée « lprds_preprod ». Rien ne se mélangeait — les
  # conteneurs et les volumes sont distincts — mais le jour d'un diagnostic,
  # lire « preprod » sur la base de production trompe forcément quelqu'un.
  #
  # ⚠️ Changer ces valeurs sur une installation EXISTANTE ne renomme rien :
  # Postgres ne lit `POSTGRES_USER`/`POSTGRES_DB` qu'à l'initialisation d'un
  # volume VIDE. Sur un volume déjà peuplé, la variable est ignorée et
  # l'application ne trouverait plus sa base. Pour renommer réellement, il faut
  # un `ALTER DATABASE` / `ALTER ROLE` à la main, puis aligner `DATABASE_URL`
  # dans `backend/.env`. Les défauts ci-dessous préservent donc l'existant.
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lprds_preprod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lprds_preprod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lprds_preprod_user} -d ${POSTGRES_DB:-lprds_preprod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - internal

  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_media:/app/media
    # ⚠️ Ports PARAMÉTRABLES, défauts historiques conservés.
    #
    # Ce fichier sert aux DEUX environnements, et ils tournent sur le même
    # VPS : avec des ports codés en dur, le second ne peut pas démarrer. La
    # production avait donc été modifiée À LA MAIN sur le serveur — ce que
    # `git pull` a fini par refuser d'écraser le jour où ce fichier a changé
    # (ajout du worker et du beat), bloquant le déploiement avec « Your local
    # changes would be overwritten by merge ».
    #
    # Un réglage qui diffère d'un environnement à l'autre appartient au `.env`
    # de la racine, jamais à un fichier suivi par git : sinon chaque
    # déploiement qui touche au compose se heurte au même mur.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # Le worker et le beat attendent CE signal : l'entrypoint du backend est le
    # seul à migrer la base, et une tâche partie avant aurait un schéma d'avance
    # sur elle. `service_started` ne dirait que « le process existe ».
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal
      - web

  # ── Tâches planifiées ──────────────────────────────────────────
  #
  # ⚠️ Ce fichier est celui que DÉPLOIE la CI (`docker compose up -d --build`
  # à la racine) ; `backend/docker-compose.yml` ne sert qu'au développement
  # local. Les deux services avaient d'abord été ajoutés au second seulement :
  # les rappels de bibliothèque et les reprises de traduction ne tournaient donc
  # nulle part en préprod ni en production, alors que tout semblait en place.
  #
  # Deux services et non un seul (`worker --beat`) : le beat est un
  # ORDONNANCEUR, il ne doit exister qu'en un exemplaire. Fusionné au worker, il
  # repartirait avec chaque réplique, et doubler les workers doublerait chaque
  # rappel reçu par un parent.
  #
  # Ils réutilisent l'image du backend mais PAS son entrypoint, qui migre, seede
  # et lance uvicorn : trois conteneurs qui migrent en même temps, c'est la
  # course garantie. `entrypoint: []` le neutralise explicitement.
  worker:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    entrypoint: []
    # `--concurrency=2` plutôt que le défaut (un process par cœur) : ces tâches
    # attendent du réseau — traduction, SMTP, base — elles ne calculent rien.
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  beat:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    entrypoint: []
    # L'état du planificateur vit dans un volume : sans lui, chaque
    # redémarrage repart d'une ardoise vierge et refait tomber les échéances
    # déjà passées. Les tâches sont idempotentes, donc rien ne casse — mais un
    # parent recevrait un second rappel à chaque déploiement, et la CI déploie
    # à chaque push.
    command: >
      celery -A app.core.celery_app beat --loglevel=info
      --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - celery_beat:/var/lib/celery
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # ── Traduction auto-hébergée (profil « translate ») ───────────
  #
  # ⚠️ Ce service n'existait que dans `backend/docker-compose.yml` — le fichier
  # qui n'est JAMAIS déployé. Exactement le piège déjà vécu avec le `worker` et
  # le `beat` : `docker compose --profile translate up -d` sur le serveur
  # n'aurait rien démarré, `LIBRETRANSLATE_URL` aurait pointé vers le vide, et
  # la traduction étant best-effort, l'échec n'aurait produit aucune erreur
  # visible — du contenu resté en français, sans explication.
  #
  # Hors profil, il ne démarre pas : l'image embarque les modèles de langue
  # (plusieurs Go) et n'a aucune raison de tourner sur une installation qui
  # utilise Claude, ou qui n'a pas activé la traduction du tout.
  #
  # `LT_LOAD_ONLY` limite le téléchargement aux deux langues du projet — sans
  # lui, l'image tire une cinquantaine de paires dont aucune ne sert.
  #
  # Réseau `internal` UNIQUEMENT, et aucun port publié : seul le backend
  # l'appelle, par son nom de service. L'exposer donnerait à n'importe qui une
  # API de traduction gratuite sur votre serveur.
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: ["translate"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "fr,en"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - libretranslate:/home/libretranslate/.local
    # `start_period` long : le premier démarrage TÉLÉCHARGE les modèles. Sans
    # cette fenêtre, le conteneur serait déclaré malsain et redémarré en
    # boucle, reprenant le téléchargement à chaque fois.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/languages')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      # ⚠️ Passé en ARG et non via `env_file` : une variable `NEXT_PUBLIC_*`
      # est lue à la compilation du bundle, et `env_file` ne vaut qu'au
      # runtime. Le workflow fournit `APP_VERSION` (SHA du commit déployé) ;
      # vide en local, ce qui désactive simplement le sondage de version.
      args:
        NEXT_PUBLIC_APP_VERSION: "${APP_VERSION:-}"
    restart: always
    env_file: ./frontend/.env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - web

networks:
  internal:
  web:

volumes:
  postgres_data:
  backend_media:
  celery_beat:
  # Les modèles de langue téléchargés au premier démarrage — plusieurs Go. Sans
  # volume, chaque recréation du conteneur les retélécharge.
  libretranslate:
